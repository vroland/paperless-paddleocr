[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "paperless-paddleocr"
version = "0.1.0"
description = "Paperless-ngx parser using a remote PaddleOCR-VL service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.28,<1",
  "lxml>=5,<7",
  "Pillow>=11",
  "pypdf>=5,<7",
]

[project.entry-points."paperless_ngx.parsers"]
paddleocr_vl = "paperless_paddleocr.parser:PaddleOCRVLParser"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]
paperless = [
  "paperless-ngx @ git+https://github.com/paperless-ngx/paperless-ngx.git@v3.0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_paddleocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["deep-research-report.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
